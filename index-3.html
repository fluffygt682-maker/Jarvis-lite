<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04100c;
    --bg2: #071a14;
    --line: #1c4a3c;
    --accent: #39ffb0;
    --accent2: #00c2ff;
    --text: #d3fbe8;
    --muted: #5b8577;
    --warn: #ff6b5e;
    --panel: rgba(57,255,176,0.045);
    --panel-border: rgba(57,255,176,0.22);
    --you-panel: rgba(0,194,255,0.08);
    --you-border: rgba(0,194,255,0.3);
    --scan-opacity: 0.05;
    --blob-opacity: 0.30;
  }
  html[data-theme="light"] {
    --bg: #eef5f1;
    --bg2: #e2efe9;
    --line: #b9d6cb;
    --accent: #0e8f5f;
    --accent2: #0086b3;
    --text: #0c261d;
    --muted: #5c7c70;
    --warn: #c93f31;
    --panel: rgba(14,143,95,0.06);
    --panel-border: rgba(14,143,95,0.25);
    --you-panel: rgba(0,134,179,0.08);
    --you-border: rgba(0,134,179,0.3);
    --scan-opacity: 0.03;
    --blob-opacity: 0.16;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, Roboto, Arial, sans-serif;
    overflow-x: hidden;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 18px 18px;
    position: relative;
    background: radial-gradient(ellipse at 50% -10%, var(--bg2), var(--bg) 60%);
  }

  /* Ambient liquid background */
  .liquid-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(26px);
    opacity: var(--blob-opacity);
    pointer-events: none;
    z-index: 0;
    will-change: transform;
  }
  .blob-a { width: 280px; height: 280px; top: -70px; left: -70px; background: radial-gradient(circle, var(--accent), transparent 70%); animation: driftA 26s ease-in-out infinite alternate; }
  .blob-b { width: 320px; height: 320px; bottom: -90px; right: -90px; background: radial-gradient(circle, var(--accent2), transparent 70%); animation: driftB 32s ease-in-out infinite alternate; }
  .blob-c { width: 240px; height: 240px; bottom: 22%; left: -110px; background: radial-gradient(circle, var(--accent), transparent 70%); animation: driftC 20s ease-in-out infinite alternate; }
  @keyframes driftA { to { transform: translate(40px, 50px) scale(1.15); } }
  @keyframes driftB { to { transform: translate(-30px, -40px) scale(1.1); } }
  @keyframes driftC { to { transform: translate(55px, -30px) scale(1.2); } }

  #bubbles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bubble-particle {
    position: absolute;
    bottom: -30px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.3), rgba(57,255,176,0.10) 45%, transparent 75%);
    border: 1px solid rgba(57,255,176,0.18);
    animation-name: floatUp;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    will-change: transform, opacity;
  }
  @keyframes floatUp {
    0% { transform: translate3d(0,0,0); opacity: 0; }
    8% { opacity: 0.55; }
    92% { opacity: 0.35; }
    100% { transform: translate3d(var(--drift, 16px), -112vh, 0); opacity: 0; }
  }

  /* HUD frame */
  .hud-corner { position: fixed; width: 22px; height: 22px; border: 2px solid var(--accent); opacity: 0.5; pointer-events: none; z-index: 5; }
  .hud-tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
  .hud-tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
  .hud-bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
  .hud-br { bottom: 12px; right: 12px; border-left: none; border-top: none; }
  #scan {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    opacity: var(--scan-opacity);
    background: repeating-linear-gradient(to bottom, #fff 0px, #fff 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
  }

  .content { position: relative; z-index: 1; width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; }

  .topbar { display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; width: 100%; margin-bottom: 4px; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-dot { width: 6px; height: 6px; background: var(--accent); box-shadow: 0 0 8px 2px var(--accent); }
  h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 7px;
    margin: 0;
    color: var(--text);
    text-shadow: 0 0 14px rgba(57,255,176,0.35);
  }
  .icon-btn {
    position: absolute;
    right: 0;
    width: 28px; height: 28px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 13px;
    color: var(--accent);
    transition: background 0.2s ease, transform 0.15s ease;
  }

  .sub-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; margin-bottom: 30px; font-family: 'JetBrains Mono', monospace; }
  .sub { color: var(--muted); font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; }
  #clearBtn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--panel-border);
    clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
    padding: 4px 10px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  #clearBtn:active { background: var(--panel); color: var(--accent); }

  /* Core */
  .core-wrap { position: relative; width: 196px; height: 196px; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
  .core-ring { position: absolute; border-radius: 50%; border: 1px solid var(--line); }
  .ring-outer { inset: 0; }
  .ring-mid { inset: 20px; border: 1px dashed var(--accent); opacity: 0.4; }
  .ring-inner { inset: 40px; opacity: 0.6; }
  .core-wrap.listening .ring-outer, .core-wrap.speaking .ring-outer { animation: ringPulse 1.6s ease-out infinite; }
  .core-wrap.listening .ring-mid, .core-wrap.speaking .ring-mid { animation: spin 3.2s linear infinite; }
  @keyframes ringPulse {
    0% { transform: scale(0.97); opacity: 0.9; }
    70% { transform: scale(1.08); opacity: 0.15; }
    100% { transform: scale(1.08); opacity: 0; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #core {
    position: relative;
    width: 118px; height: 118px;
    border-radius: 50%;
    cursor: pointer;
    user-select: none;
    background: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.32), rgba(110,170,255,0.14) 32%, rgba(10,32,56,0.32) 72%, rgba(6,18,32,0.22) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 0 40px rgba(50,130,215,0.35), inset 0 0 26px rgba(255,255,255,0.08);
    border: 1px solid rgba(150,200,255,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: box-shadow 0.3s ease, transform 0.2s ease;
  }
  #core:active { transform: scale(0.97); }
  .core-wrap.listening #core { box-shadow: 0 0 60px rgba(60,160,240,0.55), inset 0 0 30px rgba(255,255,255,0.12); }
  .core-wrap.speaking #core { box-shadow: 0 0 60px rgba(0,194,255,0.5), inset 0 0 30px rgba(255,255,255,0.12); }

  canvas#water { position: absolute; inset: 0; pointer-events: none; }
  #mic-icon { width: 24px; height: 24px; opacity: 0.85; position: relative; z-index: 2; color: #eaf4ff; transition: opacity 0.25s ease; }
  .core-wrap.listening #mic-icon, .core-wrap.speaking #mic-icon { opacity: 0; }

  #status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted);
    min-height: 16px;
    margin-bottom: 24px;
  }
  #status.active { color: var(--accent); }
  #status::after { content: '_'; animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .input-row { width: 100%; display: flex; gap: 8px; margin-bottom: 22px; font-family: 'JetBrains Mono', monospace; }
  #textInput {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    padding: 11px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
  }
  #textInput::placeholder { color: var(--muted); }
  #sendBtn {
    width: 42px; height: 42px;
    background: var(--accent);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    border: none;
    color: var(--bg);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  #sendBtn:active { transform: scale(0.95); }

  #log { width: 100%; display: flex; flex-direction: column; gap: 9px; max-height: 38vh; overflow-y: auto; padding-bottom: 20px; scrollbar-width: thin; scroll-behavior: smooth; }
  .bubble {
    max-width: 86%;
    padding: 10px 13px;
    font-size: 14px;
    line-height: 1.45;
    border: 1px solid var(--panel-border);
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  .bubble.you { align-self: flex-end; background: var(--you-panel); border-color: var(--you-border); }
  .bubble.jarvis { align-self: flex-start; background: var(--panel); }
  .bubble .label {
    display: block; font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase;
    opacity: 0.6; margin-bottom: 4px;
  }
  .bubble.you .label { color: var(--accent2); }
  .bubble.jarvis .label { color: var(--accent); }

  .thinking-dots { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .thinking-dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); animation: dotPulse 1.2s infinite ease-in-out; }
  .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dotPulse { 0%, 60%, 100% { opacity: 0.25; transform: scale(0.85); } 30% { opacity: 1; transform: scale(1); } }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-border); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="liquid-blob blob-a"></div>
  <div class="liquid-blob blob-b"></div>
  <div class="liquid-blob blob-c"></div>
  <div id="bubbles">
    <span class="bubble-particle" style="left:4%;  width:10px; height:10px; animation-duration:13s; animation-delay:-2s;  --drift:14px;"></span>
    <span class="bubble-particle" style="left:12%; width:16px; height:16px; animation-duration:17s; animation-delay:-9s;  --drift:-18px;"></span>
    <span class="bubble-particle" style="left:20%; width:7px;  height:7px;  animation-duration:11s; animation-delay:-4s;  --drift:10px;"></span>
    <span class="bubble-particle" style="left:29%; width:13px; height:13px; animation-duration:15s; animation-delay:-11s; --drift:-12px;"></span>
    <span class="bubble-particle" style="left:38%; width:9px;  height:9px;  animation-duration:12s; animation-delay:-6s;  --drift:16px;"></span>
    <span class="bubble-particle" style="left:47%; width:19px; height:19px; animation-duration:19s; animation-delay:-3s;  --drift:-20px;"></span>
    <span class="bubble-particle" style="left:56%; width:8px;  height:8px;  animation-duration:10s; animation-delay:-8s;  --drift:12px;"></span>
    <span class="bubble-particle" style="left:64%; width:14px; height:14px; animation-duration:16s; animation-delay:-1s;  --drift:-14px;"></span>
    <span class="bubble-particle" style="left:72%; width:11px; height:11px; animation-duration:13.5s; animation-delay:-10s; --drift:18px;"></span>
    <span class="bubble-particle" style="left:80%; width:17px; height:17px; animation-duration:18s; animation-delay:-5s;  --drift:-16px;"></span>
    <span class="bubble-particle" style="left:88%; width:7px;  height:7px;  animation-duration:11.5s; animation-delay:-7s;  --drift:10px;"></span>
    <span class="bubble-particle" style="left:95%; width:12px; height:12px; animation-duration:14.5s; animation-delay:-12s; --drift:-12px;"></span>
  </div>
  <div id="scan"></div>
  <div class="hud-corner hud-tl"></div>
  <div class="hud-corner hud-tr"></div>
  <div class="hud-corner hud-bl"></div>
  <div class="hud-corner hud-br"></div>

  <div class="content">
    <div class="topbar">
      <div class="brand"><span class="brand-dot"></span><h1>JARVIS</h1></div>
      <button class="icon-btn" id="themeBtn" title="toggle theme">&#9788;</button>
    </div>
    <div class="sub-row">
      <div class="sub">sys.online // tap core to speak</div>
      <button id="clearBtn" title="wipe memory">wipe</button>
    </div>

    <div class="core-wrap" id="coreWrap">
      <div class="core-ring ring-outer"></div>
      <div class="core-ring ring-mid"></div>
      <div class="core-ring ring-inner"></div>
      <canvas id="water" width="196" height="196"></canvas>
      <div id="core">
        <svg id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <path d="M12 18v3"/>
          <path d="M8 21h8"/>
        </svg>
      </div>
    </div>

    <div id="status">standby</div>

    <div class="input-row">
      <input id="textInput" type="text" placeholder="> type command..." autocomplete="off">
      <button id="sendBtn">&#10148;</button>
    </div>

    <div id="log"></div>
  </div>

<script>
// ====== CONFIG ======
const BACKEND_URL = "https://jarvis-lite-pied.vercel.app/api/chat";
const TTS_URL = "https://jarvis-lite-pied.vercel.app/api/tts";
// =====================

const coreWrap = document.getElementById('coreWrap');
const core = document.getElementById('core');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const waterCanvas = document.getElementById('water');
const waterCtx = waterCanvas.getContext('2d');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const themeBtn = document.getElementById('themeBtn');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let conversation = [];
const STORAGE_KEY = 'jarvis_conversation_v2';
const THEME_KEY = 'jarvis_theme_v2';

/* ---------- theme ---------- */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.innerHTML = theme === 'light' ? '&#9789;' : '&#9788;';
}
(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'dark';
  applyTheme(saved);
})();
themeBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});

/* ---------- persistence ---------- */
function loadConversation() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      conversation = JSON.parse(saved);
      conversation.forEach(m => addLine(m.role === 'user' ? 'you' : 'jarvis', m.content, false));
    }
  } catch (e) {
    console.warn('could not load saved conversation', e);
    conversation = [];
  }
}
function saveConversation() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(conversation)); }
  catch (e) { console.warn('could not save conversation', e); }
}
document.getElementById('clearBtn').addEventListener('click', () => {
  conversation = [];
  localStorage.removeItem(STORAGE_KEY);
  logEl.innerHTML = '';
  statusEl.textContent = "memory wiped";
  setTimeout(() => { if (!recognizing) statusEl.textContent = "standby"; }, 1500);
});

/* ---------- audio level: shared by water ring ---------- */
let level = 0;        // instantaneous target level, 0-1
let displayLevel = 0; // smoothed level actually drawn
let speakingReal = false;
let speakingFallback = false;
let waterT = 0;

let micAudioCtx, micAnalyser, micData, mediaStream;
async function startMicAnalyser() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = micAudioCtx.createMediaStreamSource(mediaStream);
    micAnalyser = micAudioCtx.createAnalyser();
    micAnalyser.fftSize = 64;
    micData = new Uint8Array(micAnalyser.frequencyBinCount);
    source.connect(micAnalyser);
  } catch (e) { console.warn('mic analyser unavailable', e); }
}
function stopMicAnalyser() {
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  if (micAudioCtx) micAudioCtx.close();
  micAnalyser = null;
}

let ttsAudioCtx, ttsAnalyser, ttsData;
function attachTtsAnalyser(audioEl) {
  try {
    ttsAudioCtx = ttsAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const source = ttsAudioCtx.createMediaElementSource(audioEl);
    ttsAnalyser = ttsAudioCtx.createAnalyser();
    ttsAnalyser.fftSize = 64;
    ttsData = new Uint8Array(ttsAnalyser.frequencyBinCount);
    source.connect(ttsAnalyser);
    ttsAnalyser.connect(ttsAudioCtx.destination);
  } catch (e) { console.warn('tts analyser unavailable', e); ttsAnalyser = null; }
}

function computeLevel() {
  if (recognizing && micAnalyser) {
    micAnalyser.getByteFrequencyData(micData);
    let sum = 0; for (let i = 0; i < micData.length; i++) sum += micData[i];
    return (sum / micData.length) / 255;
  }
  if (speakingReal && ttsAnalyser) {
    ttsAnalyser.getByteFrequencyData(ttsData);
    let sum = 0; for (let i = 0; i < ttsData.length; i++) sum += ttsData[i];
    return (sum / ttsData.length) / 255;
  }
  if (speakingFallback) {
    return 0.35 + Math.abs(Math.sin(waterT * 10)) * 0.4;
  }
  return 0;
}

function themeColors() {
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  return light
    ? { stroke: 'rgba(14,143,95,0.55)', fillA: 'rgba(14,143,95,0.16)', fillB: 'rgba(0,134,179,0.03)' }
    : { stroke: 'rgba(57,255,176,0.55)', fillA: 'rgba(57,255,176,0.22)', fillB: 'rgba(0,194,255,0.03)' };
}

function drawWater() {
  const w = waterCanvas.width, h = waterCanvas.height;
  waterCtx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const baseR = w * 0.30;
  const amp = 3 + displayLevel * 20;
  const points = 40;
  const colors = themeColors();
  const coords = [];
  for (let i = 0; i <= points; i++) {
    const angle = (i / points) * Math.PI * 2;
    const wobble = Math.sin(angle * 3 + waterT * 1.6) * amp * 0.6 + Math.sin(angle * 5 - waterT * 2.3) * amp * 0.4;
    const r = baseR + wobble;
    coords.push([cx + Math.cos(angle) * r, cy + Math.sin(angle) * r]);
  }
  waterCtx.beginPath();
  waterCtx.moveTo((coords[0][0] + coords[points - 1][0]) / 2, (coords[0][1] + coords[points - 1][1]) / 2);
  for (let i = 0; i < points; i++) {
    const next = coords[i + 1];
    waterCtx.quadraticCurveTo(coords[i][0], coords[i][1], (coords[i][0] + next[0]) / 2, (coords[i][1] + next[1]) / 2);
  }
  waterCtx.closePath();
  const grad = waterCtx.createRadialGradient(cx, cy, baseR * 0.4, cx, cy, baseR + amp);
  grad.addColorStop(0, colors.fillA);
  grad.addColorStop(1, colors.fillB);
  waterCtx.fillStyle = grad;
  waterCtx.fill();
  waterCtx.lineWidth = 1;
  waterCtx.strokeStyle = colors.stroke;
  waterCtx.stroke();
}

function tick() {
  requestAnimationFrame(tick);
  waterT += 0.018;
  level = computeLevel();
  displayLevel += (level - displayLevel) * 0.12;
  drawWater();
}
if (reduceMotion) {
  displayLevel = 0.05;
  drawWater();
} else {
  tick();
}

/* ---------- shared message pipeline (voice + typed) ---------- */
async function handleUserMessage(text) {
  if (!text || !text.trim()) return;
  addLine('you', text);
  const thinkingEl = addThinking();
  conversation.push({ role: 'user', content: text });
  saveConversation();
  try {
    const reply = await askJarvis(conversation);
    thinkingEl.remove();
    conversation.push({ role: 'assistant', content: reply });
    saveConversation();
    addLine('jarvis', reply);
    speak(reply);
  } catch (err) {
    thinkingEl.remove();
    statusEl.textContent = "link error — check backend";
    statusEl.classList.remove('active');
    console.error(err);
  }
}

/* ---------- speech recognition ---------- */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizing = false;
let recognition = null;

if (!SpeechRecognition) {
  statusEl.textContent = "voice unsupported — type instead";
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognizing = true;
    coreWrap.classList.add('listening');
    statusEl.textContent = "listening";
    statusEl.classList.add('active');
    startMicAnalyser();
  };
  recognition.onerror = (e) => {
    statusEl.textContent = "error: " + e.error;
    statusEl.classList.remove('active');
    coreWrap.classList.remove('listening');
    recognizing = false;
    stopMicAnalyser();
  };
  recognition.onend = () => {
    recognizing = false;
    coreWrap.classList.remove('listening');
    stopMicAnalyser();
  };
  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    handleUserMessage(text);
  };
}

core.addEventListener('click', () => {
  if (!recognition) { textInput.focus(); return; }
  if (recognizing) {
    recognition.stop();
  } else {
    window.speechSynthesis.cancel();
    recognition.start();
  }
});

/* ---------- typed input ---------- */
function submitTyped() {
  const text = textInput.value;
  if (!text.trim()) return;
  textInput.value = '';
  handleUserMessage(text);
}
sendBtn.addEventListener('click', submitTyped);
textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitTyped(); });

/* ---------- transcript UI ---------- */
function addLine(who, text, animate = true) {
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  if (!animate) div.style.animation = 'none';
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = who === 'you' ? 'you' : 'jarvis';
  div.appendChild(label);
  div.appendChild(document.createTextNode(text));
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}
function addThinking() {
  const div = document.createElement('div');
  div.className = 'bubble jarvis';
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = 'jarvis';
  const dots = document.createElement('div');
  dots.className = 'thinking-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(label);
  div.appendChild(dots);
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  statusEl.textContent = "processing";
  return div;
}

/* ---------- backend calls ---------- */
async function askJarvis(messages) {
  const res = await fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages })
  });
  if (!res.ok) throw new Error('Backend returned ' + res.status);
  const data = await res.json();
  return data.reply;
}

/* ---------- speaking: real TTS with browser-voice fallback ---------- */
async function speak(text) {
  coreWrap.classList.add('speaking');
  statusEl.textContent = "speaking";
  statusEl.classList.add('active');

  try {
    const res = await fetch(TTS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!res.ok) throw new Error('TTS backend error');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    attachTtsAnalyser(audio);
    speakingReal = true;
    audio.onended = () => {
      speakingReal = false;
      coreWrap.classList.remove('speaking');
      statusEl.textContent = "standby";
      statusEl.classList.remove('active');
      URL.revokeObjectURL(url);
    };
    audio.onerror = () => { speakingReal = false; throw new Error('audio playback failed'); };
    await audio.play();
  } catch (e) {
    console.warn('Falling back to browser voice:', e);
    speakingReal = false;
    speakBrowserVoice(text);
  }
}

function speakBrowserVoice(text) {
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.0;
  utter.onstart = () => { speakingFallback = true; coreWrap.classList.add('speaking'); statusEl.textContent = "speaking"; statusEl.classList.add('active'); };
  utter.onend = () => { speakingFallback = false; coreWrap.classList.remove('speaking'); statusEl.textContent = "standby"; statusEl.classList.remove('active'); };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

loadConversation();
